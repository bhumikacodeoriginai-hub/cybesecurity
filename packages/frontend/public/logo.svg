<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <!-- Background -->
  <rect width="200" height="60" fill="transparent"/>
  
  <!-- CC Emblem - Gold gradient -->
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="50%" style="stop-color:#d97706"/>
      <stop offset="100%" style="stop-color:#b45309"/>
    </linearGradient>
    <linearGradient id="dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#374151"/>
      <stop offset="100%" style="stop-color:#1f2937"/>
    </linearGradient>
  </defs>
  
  <!-- First C (Gold) -->
  <path d="M8 12 L22 6 L22 14 L14 17 L14 43 L22 46 L22 54 L8 48 Z" fill="url(#gold)"/>
  
  <!-- Second C (Dark with circuit) -->
  <path d="M24 12 L38 12 L38 18 L30 18 L30 42 L38 42 L38 48 L24 48 Z" fill="url(#dark)"/>
  
  <!-- Circuit dots -->
  <circle cx="42" cy="22" r="3" fill="#374151"/>
  <circle cx="42" cy="30" r="3" fill="#374151"/>
  <circle cx="42" cy="38" r="3" fill="#374151"/>
  
  <!-- Circuit lines -->
  <line x1="38" y1="22" x2="39" y2="22" stroke="#374151" stroke-width="2"/>
  <line x1="38" y1="30" x2="39" y2="30" stroke="#374151" stroke-width="2"/>
  <line x1="38" y1="38" x2="39" y2="38" stroke="#374151" stroke-width="2"/>
  
  <!-- Text: CodeOrigin.ai -->
  <text x="52" y="36" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#d97706">Code</text>
  <text x="92" y="36" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#374151">Origin</text>
  <text x="142" y="36" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#d97706">.ai</text>
</svg>
